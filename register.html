<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header class="header">
        <div class="headertop">
            <a href="./index.html">
                <img class="logo" src="./img/logorugbystore.png" alt="Logo de Rugby Store">
            </a>

            <form class="buscador" action="./search-results.html" method="GET">
                <label for="busqueda">Buscar productos:</label>
                <input id="busqueda" type="text" name="busqueda" value="">
                <button type="submit">Buscar</button>
            </form>
        </div>

        <nav class="menuprincipal">
        <ul>
             <li><a href="./index.html">Home</a></li>
             <li id="login-link"> <a href="./login.html">Login</a></li>
             <li id="registro-link"><a href="./register.html">Registro</a></li>
             <li id="saludo-usuario" hidden></li>
              <li id="logout-contenedor" hidden><a id="logout-link" href="#">Logout</a></li>
       </ul>
        </nav>
    </header>

    <main class="formulario-pagina"> 
        <form class="register-form" id="formulario-registro" action="./login.html" method="GET">
            <div class="campo">
         <label for="email"> Email </label>
         <input type="email" id="email" name="email">
         <p id="error-email" class="mensaje-error"></p>
            </div>
            <div class="campo"> 
         <label for="password">Contraseña </label>
         <input type="password" id="password" name="password">
         <p id="error-password" class="mensaje-error"></p>
            </div>
            <div class="campo">
         <label for="password">Repetir Contraseña </label>
         <input type="password" id="repeat-password" name="repeat-password">
         <p id="error-repeat-password" class="mensaje-error"></p>
            </div>
         <div class="terminos">
            <input type="checkbox" id="terminos" name="terminos">
            <label for="terminos">Acepto terminos y condiciones </label>
         </div>
         <button type="submit"> Registrarme </button>
         <a href="./login.html">Ya tengo una cuenta </a>
        </form>
    </main>

    <footer class="footer">

        <p>
            Integrantes: Santino Andrelo, Marcos Pisano y Joaquín Eduardo Dacal.
        </p>

    </footer>
    <script src="./js/index.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
    <script src="./js/register.js"></script>
</body>
</html>
